name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --extra dev --extra mcp --locked

      - name: Validate tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv run python -c 'from importlib.metadata import version; print(version("opencontextengine-client"))')"
          if [[ "${project_version}" != "${tag_version}" ]]; then
            echo "pyproject version ${project_version} does not match tag ${tag_version}"
            exit 1
          fi

      - name: Run Ruff
        run: uv run ruff check src tests benchmarks

      - name: Run tests
        run: uv run pytest -q

  python-package:
    name: publish Python package
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
