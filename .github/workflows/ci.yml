name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust tests
        shell: bash
        run: |
          set -o pipefail
          if cargo test --all-targets --locked 2>&1 | tee cargo-test.log; then
            exit 0
          fi
          message="$(tail -c 50000 cargo-test.log)"
          message="${message//'%'/'%25'}"
          message="${message//$'\r'/'%0D'}"
          message="${message//$'\n'/'%0A'}"
          printf '::error title=Rust tests failed::%s\n' "$message"
          exit 1

  benchmark-tooling:
    name: benchmark tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install locked development dependencies
        run: uv sync --locked

      - name: Check benchmark tooling
        run: uv run ruff check benchmarks tests/test_benchmark.py

      - name: Run benchmark-tooling tests
        run: uv run pytest -q tests/test_benchmark.py
