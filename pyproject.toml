[project]
name = "opencontextengine-client"
version = "0.1.0"
description = "Standalone workspace and blob synchronization client for OpenContextEngine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenContextEngine Contributors" }]
keywords = ["code", "retrieval", "context", "ai", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
    "pathspec>=0.12.1",
    "watchfiles>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/oce-ai/oce-client"
Repository = "https://github.com/oce-ai/oce-client"
Documentation = "https://github.com/oce-ai/oce-client/blob/master/README.md"
Issues = "https://github.com/oce-ai/oce-client/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.14.2",
]
mcp = [
    "mcp>=1.0.0,<2",
]

[project.scripts]
oce-client = "oce_client.cli:main"
oce-client-mcp = "oce_client.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oce_client"]

[tool.hatch.build.targets.wheel.force-include]
"skills/oce-client" = "oce_client/skill"

[tool.pytest.ini_options]
testpaths = ["tests"]
