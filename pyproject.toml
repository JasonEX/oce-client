[project]
name = "oce-client-benchmarks"
version = "0.0.0"
description = "Development-only benchmark tooling for the Rust oce-client"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
]

[project.urls]
Repository = "https://github.com/JasonEX/oce-client"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.14.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["benchmarks"]
